services:
  traceback:
    build:
      context: .
      dockerfile: Dockerfile
    image: traceback:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      TRACEBACK_ENVIRONMENT: production
      TRACEBACK_DATABASE_PATH: /data/traceback.db
    volumes:
      - traceback-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    init: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: traceback-frontend:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - traceback
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    init: true

volumes:
  traceback-data:
