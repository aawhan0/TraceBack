[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "trbk"
version = "0.1.3"
description = "LLM-assisted incident investigation and deterministic evaluation."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Aawhan Vyas" },
  { email = "vyasaawhan@gmail.com" },
]
license = { file = "LICENSE" }
keywords = ["llm", "incident-response", "root-cause-analysis", "evaluation", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "httpx2>=2,<3",
  "mcp>=2.2,<3",
  "msgpack>=1.2.1,<2",
]

[project.urls]
Homepage = "https://github.com/aawhan0/TraceBack"
Repository = "https://github.com/aawhan0/TraceBack"
Issues = "https://github.com/aawhan0/TraceBack/issues"

[project.scripts]
trbk = "app.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mcp[cli]>=2.2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.setuptools.packages.find]
include = ["app*"]
