name: Benchmark Gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-benchmark:
    name: Deterministic Evaluation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run deterministic benchmark
        env:
          TRACEBACK_DATABASE_PATH: ${{ runner.temp }}/traceback-benchmark.db
        run: |
          traceback benchmark \
            --name ci-baseline \
            --repetitions 3 \
            --min-pass-rate 1.0 \
            --report \
            --fail-on-regression > benchmark-report.md
          cat benchmark-report.md

      - name: Publish benchmark summary
        if: always() && hashFiles('benchmark-report.md') != ''
        run: cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark report
        if: always() && hashFiles('benchmark-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.md
          retention-days: 7
